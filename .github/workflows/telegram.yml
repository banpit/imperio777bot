name: Enviar mensagem no Telegram

on:
  schedule:
    - cron: "0 13 * * *"   # 10h Brasília
    - cron: "0 18 * * *"   # 15h Brasília
    - cron: "0 23 * * *"   # 20h Brasília
  workflow_dispatch:
    inputs:
      continuo:
        description: "Rodar em loop (true) ou enviar só 1 vez de teste (false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_TESTE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.continuo != 'true' }}
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add estado.json || true
          git commit -m "atualiza estado" || exit 0
          git push
